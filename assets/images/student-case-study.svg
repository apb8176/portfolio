<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Student Case Study</title>
  <desc id="desc">A student career experience showing readiness, skills and a personalized roadmap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161720"/><stop offset="1" stop-color="#242832"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6ca8ff"/><stop offset="1" stop-color="#8b75ff"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffdb70"/><stop offset="1" stop-color="#ffad5c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/><circle cx="1100" cy="70" r="230" fill="#ffdb70" opacity=".05"/>
  <text x="70" y="80" fill="#ffdb70" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="4">PRODUCT CASE STUDY</text>
  <text x="70" y="145" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="700">Student Experience</text>
  <text x="72" y="188" fill="#adb0b9" font-family="Arial,sans-serif" font-size="22">A connected journey from readiness to career growth</text>
  <g transform="translate(230 225)" filter="url(#shadow)">
    <g transform="rotate(-5 155 230)"><rect width="310" height="480" rx="42" fill="#0d0e14"/><rect x="12" y="12" width="286" height="456" rx="34" fill="#f6f7fb"/><rect x="112" y="24" width="88" height="12" rx="6" fill="#1c1d25"/>
      <text x="34" y="80" fill="#252630" font-family="Arial,sans-serif" font-size="18" font-weight="700">Good morning, Chandana</text><rect x="30" y="104" width="250" height="116" rx="22" fill="url(#blue)"/><text x="50" y="142" fill="#fff" font-family="Arial,sans-serif" font-size="13">CAREER READINESS</text><text x="50" y="190" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">82%</text><circle cx="238" cy="164" r="30" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="9"/><path d="M238 134a30 30 0 1 1-27 43" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
      <text x="30" y="264" fill="#252630" font-family="Arial,sans-serif" font-size="17" font-weight="700">Your journey</text><g fill="#fff" stroke="#e6e7ed"><rect x="30" y="284" width="74" height="92" rx="16"/><rect x="118" y="284" width="74" height="92" rx="16"/><rect x="206" y="284" width="74" height="92" rx="16"/></g><circle cx="67" cy="319" r="16" fill="#ffe5a0"/><circle cx="155" cy="319" r="16" fill="#cddcff"/><circle cx="243" cy="319" r="16" fill="#ddd4ff"/><g fill="#565762" font-family="Arial,sans-serif" font-size="11"><text x="44" y="354">Skills</text><text x="130" y="354">Coach</text><text x="219" y="354">Career</text></g><rect x="30" y="398" width="250" height="40" rx="13" fill="#20212a"/><text x="105" y="424" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Continue journey</text>
    </g>
    <g transform="translate(430 12) rotate(5 155 230)"><rect width="310" height="480" rx="42" fill="#0d0e14"/><rect x="12" y="12" width="286" height="456" rx="34" fill="#f6f7fb"/><rect x="112" y="24" width="88" height="12" rx="6" fill="#1c1d25"/><text x="34" y="79" fill="#252630" font-family="Arial,sans-serif" font-size="20" font-weight="700">Skill insights</text>
      <g fill="#fff" stroke="#e5e6ed"><rect x="30" y="104" width="250" height="64" rx="17"/><rect x="30" y="184" width="250" height="64" rx="17"/><rect x="30" y="264" width="250" height="64" rx="17"/></g><circle cx="67" cy="136" r="20" fill="url(#gold)"/><circle cx="67" cy="216" r="20" fill="#cad9ff"/><circle cx="67" cy="296" r="20" fill="#ddd4ff"/><g font-family="Arial,sans-serif"><text x="100" y="130" fill="#252630" font-size="14" font-weight="700">Communication</text><text x="100" y="151" fill="#777985" font-size="11">Advanced · 86%</text><text x="100" y="210" fill="#252630" font-size="14" font-weight="700">Problem solving</text><text x="100" y="231" fill="#777985" font-size="11">Proficient · 78%</text><text x="100" y="290" fill="#252630" font-size="14" font-weight="700">Critical thinking</text><text x="100" y="311" fill="#777985" font-size="11">Growing · 70%</text></g><rect x="30" y="356" width="250" height="82" rx="18" fill="url(#blue)"/><text x="50" y="389" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Personalized roadmap</text><text x="50" y="414" fill="#fff" fill-opacity=".8" font-family="Arial,sans-serif" font-size="11">3 recommended next steps</text>
    </g>
  </g>
</svg>
