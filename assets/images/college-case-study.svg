<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">College Case Study</title>
  <desc id="desc">A college analytics dashboard showing student readiness and outcomes.</desc>
